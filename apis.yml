name: Mixt
description: >-
  MIXT is a chef-driven fast-casual salad and grain-bowl restaurant chain
  operating across the San Francisco Bay Area and Los Angeles. Founded on
  sourcing fresh, local, seasonal, and organic ingredients, MIXT prepares its
  greens, grains, grilled meats, dressings, and drinks in-house and offers
  customizable salads (80+ ingredients), warm grain bowls, sandwiches, catering,
  and a rewards loyalty program. MIXT is a Certified B Corporation (since 2018),
  reflecting a commitment to sustainable sourcing and environmental
  responsibility. It was surfaced as a portfolio company of Obvious Ventures and
  added to the API Evangelist network. MIXT is a consumer restaurant brand and
  does not publish a public developer platform, API, or SDKs; online ordering is
  offered through a hosted ordering surface at order.mixt.com.
